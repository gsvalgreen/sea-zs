# DataSource settings: conexao configuravel por variaveis de ambiente (DB_*), com defaults de desenvolvimento.
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/seazs}
spring.datasource.username = ${DB_USER:root}
spring.datasource.password = ${DB_PASSWORD:system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show or not log for each sql query
spring.jpa.show-sql = ${SHOW_SQL:true}

# Hibernate ddl auto (create, create-drop, update, validate, none). Em producao use DDL_AUTO=validate ou none e SHOW_SQL=false.
spring.jpa.hibernate.ddl-auto = ${DDL_AUTO:update}

# Flyway (migracoes em db/migration). Desligado por padrao para preservar o dev local (ddl-auto=update).
# Ambientes nao locais: FLYWAY_ENABLED=true e DDL_AUTO=validate. Banco ja criado pelo Hibernate (sem historico do Flyway):
# baseline-on-migrate marca a V1 como aplicada e nao a executa; em banco vazio a V1 roda normalmente.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# O dialeto (MySQL8Dialect) e detectado automaticamente pelo Hibernate a partir da conexao.
# Use spring.jpa.properties.* para propriedades nativas do Hibernate (o prefixo e removido).

#Configuracao do fuso horario
spring.jackson.time-zone: America/Sao_Paulo

# Nao vazar detalhes internos nas respostas de erro (stacktrace, mensagem da excecao, erros de binding).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Actuator: expor somente /actuator/health, sem detalhes de componentes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Open-in-view fica no padrao do Boot (ligado; o Boot registra aviso na partida). Desligar exige revisar acessos lazy nos controllers.
