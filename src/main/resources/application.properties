# DataSource settings: conexao configuravel por variaveis de ambiente (DB_*), com defaults de desenvolvimento.
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/seazs}
spring.datasource.username = ${DB_USER:root}
spring.datasource.password = ${DB_PASSWORD:system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show or not log for each sql query
spring.jpa.show-sql = ${SHOW_SQL:true}

# Hibernate ddl auto (create, create-drop, update, validate, none). Em producao use DDL_AUTO=validate ou none e SHOW_SQL=false.
spring.jpa.hibernate.ddl-auto = ${DDL_AUTO:update}

# Flyway (migracoes em db/migration). Desligado por padrao para preservar o dev local (ddl-auto=update).
# Ambientes nao locais: FLYWAY_ENABLED=true e DDL_AUTO=validate. Banco ja criado pelo Hibernate (sem historico do Flyway):
# Banco vazio: a V1 roda normalmente. Banco legado (criado pelo Hibernate, sem historico): so com FLYWAY_BASELINE_ON_MIGRATE=true
# no primeiro deploy; a V1 e marcada como aplicada SEM executar e NAO e conferida. O banco precisa estar identico ao baseline
# (turno varchar(1), collation utf8mb4_unicode_ci, nomes das FKs) ou receber um V2 corretivo/ALTER manual antes. Desligue depois.
# Producao: migracoes com usuario DDL separado (spring.flyway.user/password); a aplicacao usa usuario so com DML. Nunca root.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

# O dialeto (MySQL8Dialect) e detectado automaticamente pelo Hibernate a partir da conexao.
# Use spring.jpa.properties.* para propriedades nativas do Hibernate (o prefixo e removido).

#Configuracao do fuso horario
spring.jackson.time-zone: America/Sao_Paulo

# Nao vazar detalhes internos nas respostas de erro (stacktrace, mensagem da excecao, erros de binding).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Actuator: expor somente /actuator/health, sem detalhes de componentes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Open-in-view fica no padrao do Boot (ligado; o Boot registra aviso na partida). Desligar exige revisar acessos lazy nos controllers.

# Seguranca (Fase 2). JWT_SECRET e OBRIGATORIO (minimo 32 bytes; gere com `openssl rand -base64 48`) e NAO tem valor
# padrao: sem ele a aplicacao nao sobe. Nunca versionar o segredo. Tempos em ISO-8601 (PT15M = 15 minutos, P7D = 7 dias).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:seazs}
app.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:P7D}

# CORS global: origens permitidas separadas por virgula (sem curingas).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Rate limiting por IP e bloqueio (lockout) progressivo por e-mail em /api/v1/auth/login, /api/v1/auth/refresh,
# /usuario/login e /usuario/inserir. Estado em memoria de UMA instancia (veja o README). Duracoes em ISO-8601.
app.security.rate-limit.max-requisicoes=10
app.security.rate-limit.janela=PT1M
app.security.lockout.max-falhas=5
app.security.lockout.janela-falhas=PT15M
app.security.lockout.duracao=PT15M
app.security.lockout.duracao-maxima=PT24H
app.security.lockout.retencao=PT24H
app.security.max-entradas=100000

# O IP do limite e request.getRemoteAddr(). Atras de proxy/load balancer CONFIAVEL defina
# server.forward-headers-strategy=native (ou framework) para o container resolver o IP real a partir de
# X-Forwarded-For; sem isso o header e ignorado (nunca confie em header arbitrario enviado pelo cliente).
# server.forward-headers-strategy=native
