# Perfil dos testes de integracao: H2 em memoria no modo MySQL no lugar do MySQL real.
# Sobrescreve o application.properties de producao (datasource, dialeto e driver).
spring.datasource.url=jdbc:h2:mem:seazs;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
# schema.sql de referencia nao deve ser carregado (Boot 2.1: initialization-mode; Boot 2.5+: spring.sql.init.mode=never)
spring.datasource.initialization-mode=never
