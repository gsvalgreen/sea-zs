# Lido pelo SonarSource/sonarqube-scan-action (ver .github/workflows/ci.yml).
# Organizacao e project key vem de variaveis do GitHub (SONAR_ORGANIZATION,
# SONAR_PROJECT_KEY) passadas como -D no workflow; token em secrets.SONAR_TOKEN.
sonar.projectName=seazs
sonar.sources=src/main/java,src/main/resources
sonar.tests=src/test/java
sonar.java.source=8
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
