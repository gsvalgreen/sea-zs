plugins {
    id 'org.springframework.boot' version '3.5.16'
}
apply plugin: 'java'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'jacoco'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

group = 'br.com.fateczs'
version = '0.0.1-SNAPSHOT'

description = """seazs"""

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}



repositories {

    maven { url "https://repo.maven.apache.org/maven2" }
}
dependencies {
    // Versoes gerenciadas pelo BOM do Boot (3.5.x: Hibernate 6.6, H2 2.3, JUnit Jupiter 5.12, Mockito 5.17, Testcontainers 1.21).
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // Driver oficial do MySQL 8 (artefato com.mysql:mysql-connector-j, versao do BOM do Boot).
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // integration: banco em memoria (versao gerenciada pelo BOM do Boot)
    testRuntimeOnly 'com.h2database:h2'
    // featureTest: MySQL 8 real via Docker (extensao JUnit 5 do Testcontainers)
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

// Camadas da piramide de testes, separadas por pacote em src/test (unit, integration, featureTest).
// `test` roda apenas unit; `integrationTest` e `featureTest` rodam as demais camadas; `check` roda as tres.
test {
    useJUnitPlatform()
    exclude '**/integration/**'
    exclude '**/featureTest/**'
}

task integrationTest(type: Test) {
    group = 'verification'
    description = 'Testes de integracao (H2, @DataJpaTest, @WebMvcTest)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/integration/**'
    shouldRunAfter test
}

task featureTest(type: Test) {
    group = 'verification'
    description = 'Testes de fluxo completo com Testcontainers (exigem Docker; sem Docker sao pulados, exceto com CI=true)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/featureTest/**'
    shouldRunAfter integrationTest
}

check.dependsOn integrationTest, featureTest

// Evita que um .exec antigo (de execucao anterior) entre na cobertura combinada.
[test, integrationTest, featureTest].each { t ->
    t.doFirst { delete t.extensions.getByType(JacocoTaskExtension).destinationFile }
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// ---------------------------------------------------------------------------
// Qualidade/CI (mantido isolado; usado por .github/workflows/ci.yml)
// ---------------------------------------------------------------------------
// Gradle 8.14 / JDK 17 / jacoco 0.8.12. Pendencias para as proximas etapas do plano:
//  - Sonar continua via SonarSource/sonarqube-scan-action + sonar-project.properties (o scanner exige JVM 17,
//    que agora e a JVM do build): da para trocar por `id 'org.sonarqube'` e remover o passo do scan-action;
//  - Gradle 9: `xml.required`/`html.required` ja estao na sintaxe nova; `sonar.coverage.jacoco.xmlReportPaths` permanece;
//  - revisar os limiares abaixo se a cobertura mudar.
// Limiar = cobertura medida em 2026-10 (instrucoes 94,5%; branches 75,5%),
// levemente abaixo. Medida sem o contextLoads (sem MySQL); no CI ele roda.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}
test.finalizedBy jacocoTestReport
// Explicito para garantir o gate no `check` (e ordenado depois das tres camadas abaixo).
check.dependsOn jacocoTestCoverageVerification
jacocoTestCoverageVerification.mustRunAfter jacocoTestReport

// Cobertura combinada das tres camadas (test + integrationTest + featureTest).
// Sem isso o relatorio e o gate considerariam apenas os testes unitarios.
// Com `build`/`check` o relatorio roda de novo apos as tres camadas (check.dependsOn abaixo);
// `.exec` ausente (ex.: featureTest pulado sem Docker) e ignorado pelo filtro `exists`.
def execucoesJacoco = files({
    [test, integrationTest, featureTest].collect { it.extensions.getByType(JacocoTaskExtension).destinationFile }
            .findAll { it.exists() }
})
jacocoTestReport.executionData.setFrom(execucoesJacoco)
jacocoTestCoverageVerification.executionData.setFrom(execucoesJacoco)
[jacocoTestReport, jacocoTestCoverageVerification].each { it.mustRunAfter integrationTest, featureTest }
check.dependsOn jacocoTestReport
