plugins {
    id 'org.springframework.boot' version '2.1.6.RELEASE'
}
apply plugin: 'java'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'jacoco'

group = 'br.com.fateczs'
version = '0.0.1-SNAPSHOT'

description = """seazs"""

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}



repositories {

    maven { url "https://repo.maven.apache.org/maven2" }
}
dependencies {
    // Versoes gerenciadas pelo BOM do Boot (2.1.6). Em 2.1.x a Bean Validation ja vem no
    // starter-web (spring-boot-starter-validation so existe a partir do Boot 2.3).
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // developmentOnly so existe a partir do plugin Boot 2.3; ate la devtools fica em runtimeOnly (como antes).
    runtimeOnly 'org.springframework.boot:spring-boot-devtools'
    // Driver mantido em 5.1.46 (o BOM traria 8.0.16); a troca para mysql-connector-j e etapa posterior.
    runtimeOnly 'mysql:mysql-connector-java:5.1.46'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // integration: banco em memoria (versao gerenciada pelo BOM do Boot)
    testRuntimeOnly 'com.h2database:h2'
    // featureTest: MySQL real via Docker (1.x, compativel com Java 8 e JUnit 4)
    testImplementation 'org.testcontainers:mysql:1.21.4'
}

// Camadas da piramide de testes, separadas por pacote em src/test (unit, integration, featureTest).
// `test` roda apenas unit; `integrationTest` e `featureTest` rodam as demais camadas; `check` roda as tres.
test {
    exclude '**/integration/**'
    exclude '**/featureTest/**'
}

task integrationTest(type: Test) {
    group = 'verification'
    description = 'Testes de integracao (H2, @DataJpaTest, @WebMvcTest)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/integration/**'
    shouldRunAfter test
}

task featureTest(type: Test) {
    group = 'verification'
    description = 'Testes de fluxo completo com Testcontainers (exigem Docker; sem Docker sao pulados, exceto com CI=true)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/featureTest/**'
    shouldRunAfter integrationTest
}

check.dependsOn integrationTest, featureTest

// Evita que um .exec antigo (de execucao anterior) entre na cobertura combinada.
[test, integrationTest, featureTest].each { t ->
    t.doFirst { delete t.extensions.getByType(JacocoTaskExtension).destinationFile }
}

jacoco {
    toolVersion = '0.8.5'
}

jacocoTestReport {
    reports {
        xml.enabled true
        html.enabled true
        csv.enabled false
    }
}

// ---------------------------------------------------------------------------
// Qualidade/CI (mantido isolado; usado por .github/workflows/ci.yml)
// ---------------------------------------------------------------------------
// Compativel com Gradle 6.9 (Java 8). Ao migrar o Gradle/Boot/Java, revisar:
//  - Sonar NAO usa o plugin Gradle: o scanner atual exige JVM 17 e o Gradle 6.9
//    roda so em JDK <= 16 (testado com Gradle 4.5: plugin 2.7.1 falha com "class file version 61").
//    O CI usa SonarSource/sonarqube-scan-action + sonar-project.properties.
//    Apos migrar para Gradle 7+/JDK 17 da para trocar por `id 'org.sonarqube'`
//    e remover sonar-project.properties e o passo do scan-action;
//  - jacoco toolVersion: 0.8.5 nao le classes Java 17+ (usar >= 0.8.11);
//  - sintaxe: `xml.enabled`/`html.enabled` viram `xml.required`/`html.required`
//    (Gradle 7+); `sonar.coverage.jacoco.xmlReportPaths` permanece;
//  - setup-java do CI e a versao do JDK no workflow (hoje 8, ver .sdkmanrc);
//  - revisar os limiares abaixo se a cobertura mudar.
// Limiar = cobertura medida em 2026-10 (instrucoes 94,5%; branches 75,5%),
// levemente abaixo. Medida sem o contextLoads (sem MySQL); no CI ele roda.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}
test.finalizedBy jacocoTestReport
// Explicito para garantir o gate no `check` (e ordenado depois das tres camadas abaixo).
check.dependsOn jacocoTestCoverageVerification
jacocoTestCoverageVerification.mustRunAfter jacocoTestReport

// Cobertura combinada das tres camadas (test + integrationTest + featureTest).
// Sem isso o relatorio e o gate considerariam apenas os testes unitarios.
// Com `build`/`check` o relatorio roda de novo apos as tres camadas (check.dependsOn abaixo);
// `.exec` ausente (ex.: featureTest pulado sem Docker) e ignorado pelo filtro `exists`.
def execucoesJacoco = files({
    [test, integrationTest, featureTest].collect { it.extensions.getByType(JacocoTaskExtension).destinationFile }
            .findAll { it.exists() }
})
jacocoTestReport.executionData.setFrom(execucoesJacoco)
jacocoTestCoverageVerification.executionData.setFrom(execucoesJacoco)
[jacocoTestReport, jacocoTestCoverageVerification].each { it.mustRunAfter integrationTest, featureTest }
check.dependsOn jacocoTestReport
