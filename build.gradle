plugins {
    id 'org.springframework.boot' version '2.1.6.RELEASE'
}
apply plugin: 'java'
apply plugin: 'maven'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'jacoco'

group = 'br.com.fateczs'
version = '0.0.1-SNAPSHOT'

description = """seazs"""

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}



repositories {

    maven { url "https://repo.maven.apache.org/maven2" }
}
dependencies {
    compile group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa', version:'2.0.3.RELEASE'
    compile group: 'org.springframework.boot', name: 'spring-boot-starter-thymeleaf', version:'2.0.3.RELEASE'
    compile group: 'org.springframework.boot', name: 'spring-boot-starter-web', version:'2.0.3.RELEASE'
    compile group: 'org.springframework.boot', name: 'spring-boot-starter-actuator', version:'2.0.3.RELEASE'
    compile group: 'org.codehaus.groovy', name: 'groovy', version:'2.4.13'
    runtime group: 'org.springframework.boot', name: 'spring-boot-devtools', version:'2.0.3.RELEASE'
    runtime group: 'mysql', name: 'mysql-connector-java', version:'5.1.46'
    testCompile group: 'org.springframework.boot', name: 'spring-boot-starter-test', version:'2.0.3.RELEASE'
    // integration: banco em memoria (versao gerenciada pelo BOM do Boot)
    testRuntime group: 'com.h2database', name: 'h2'
    // featureTest: MySQL real via Docker (a ultima 1.x compativel com Java 8 e JUnit 4)
    testCompile group: 'org.testcontainers', name: 'mysql', version: '1.19.8'
}

// Camadas da piramide de testes, separadas por pacote em src/test (unit, integration, featureTest).
// `test` roda apenas unit; `integrationTest` e `featureTest` rodam as demais camadas; `check` roda as tres.
test {
    exclude '**/integration/**'
    exclude '**/featureTest/**'
}

task integrationTest(type: Test) {
    group = 'verification'
    description = 'Testes de integracao (H2, @DataJpaTest, @WebMvcTest)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/integration/**'
    shouldRunAfter test
}

task featureTest(type: Test) {
    group = 'verification'
    description = 'Testes de fluxo completo com Testcontainers (exigem Docker; sem Docker sao pulados)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/featureTest/**'
    shouldRunAfter integrationTest
}

check.dependsOn integrationTest, featureTest

jacoco {
    toolVersion = '0.8.5'
}

jacocoTestReport {
    reports {
        xml.enabled true
        html.enabled true
        csv.enabled false
    }
}

// ---------------------------------------------------------------------------
// Qualidade/CI (mantido isolado; usado por .github/workflows/ci.yml)
// ---------------------------------------------------------------------------
// Compativel com Gradle 4.5. Ao migrar o Gradle/Boot/Java, revisar:
//  - Sonar NAO usa o plugin Gradle: o scanner atual exige JVM 17 e o Gradle 4.5
//    roda so em JDK <= 8 (testado: plugin 2.7.1 falha com "class file version 61").
//    O CI usa SonarSource/sonarqube-scan-action + sonar-project.properties.
//    Apos migrar para Gradle 7+/JDK 17 da para trocar por `id 'org.sonarqube'`
//    e remover sonar-project.properties e o passo do scan-action;
//  - jacoco toolVersion: 0.8.5 nao le classes Java 17+ (usar >= 0.8.11);
//  - sintaxe: `xml.enabled`/`html.enabled` viram `xml.required`/`html.required`
//    (Gradle 7+); `sonar.coverage.jacoco.xmlReportPaths` permanece;
//  - setup-java do CI e a versao do JDK no workflow (hoje 8, ver .sdkmanrc);
//  - revisar os limiares abaixo se a cobertura mudar.
// Limiar = cobertura medida em 2026-10 (instrucoes 94,5%; branches 75,5%),
// levemente abaixo. Medida sem o contextLoads (sem MySQL); no CI ele roda.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}
test.finalizedBy jacocoTestReport
// Gradle 4.5 nao liga jacocoTestCoverageVerification ao `check` automaticamente.
check.dependsOn jacocoTestCoverageVerification
jacocoTestCoverageVerification.mustRunAfter jacocoTestReport
